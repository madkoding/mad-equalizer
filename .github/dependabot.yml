version: 2
updates:
  - package-ecosystem: npm
    directory: /windows
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # Electron va fijado a 33.x en pack.sh y package.json; subir de versión mayor
      # requiere migrar el empaquetado y probar el instalador de Windows.
      - dependency-name: electron
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
