name: Release

# Cada push a main publica un release si hay cambios que lo ameritan (commits semánticos desde el último tag):
#   feat -> minor, fix / perf -> patch, "tipo!:" o "BREAKING CHANGE" -> major; chore / docs / ci / test / refactor no publican.
# También se puede lanzar a mano: sin tag calcula la versión; con tag publica exactamente ese.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (por ejemplo v1.2.0). Vacío = calcular desde los commits"
        required: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -n "$last" ]; then range="$last..HEAD"; base=${last#v}; else range="HEAD"; base="0.0.0"; fi
          subjects=$(git log --format=%s $range)
          bodies=$(git log --format=%b $range)
          IFS=. read -r major minor patch <<< "$base"
          if echo "$subjects" | grep -Eq '^[a-z]+(\([^)]*\))?!:' || echo "$bodies" | grep -q '^BREAKING CHANGE'; then
            major=$((major+1)); minor=0; patch=0
          elif echo "$subjects" | grep -Eq '^feat(\([^)]*\))?:'; then
            minor=$((minor+1)); patch=0
          elif echo "$subjects" | grep -Eq '^(fix|perf)(\([^)]*\))?:'; then
            patch=$((patch+1))
          else
            echo "Sin cambios que ameriten release desde ${last:-el inicio}."; exit 0
          fi
          echo "Nueva versión: v$major.$minor.$patch (anterior: ${last:-ninguna})"
          echo "tag=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"

  macos:
    name: Build macOS (.dmg)
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build universal app
        working-directory: macos
        run: ./build.sh
      - name: Make DMG
        working-directory: macos
        run: ./make_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: macos/*.dmg
          if-no-files-found: error

  windows:
    name: Build Windows (setup .zip)
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh nsis
      - name: Install dependencies
        working-directory: windows
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci
      - name: Download Electron runtime (verified)
        working-directory: windows
        run: |
          V=$(sed -n 's/^V=//p' pack.sh)
          mkdir -p .cache
          base=https://github.com/electron/electron/releases/download/v$V
          curl -sSLf -o .cache/electron-v$V-win32-x64.zip $base/electron-v$V-win32-x64.zip
          curl -sSLf -o SHASUMS256.txt $base/SHASUMS256.txt
          grep " \*electron-v$V-win32-x64.zip$" SHASUMS256.txt | sed 's#\*#.cache/#' | sha256sum -c -
      - name: Download Equalizer APO installer (verified)
        working-directory: windows
        run: |
          mkdir -p vendor
          curl -sSLf -o vendor/EqualizerAPO-x64-1.4.2.exe \
            "https://sourceforge.net/projects/equalizerapo/files/1.4.2/EqualizerAPO-x64-1.4.2.exe/download"
          echo "7403be7427bbe1936a40dded082829b6e217fc4f5990fee5cba501f0ae055afa  vendor/EqualizerAPO-x64-1.4.2.exe" | sha256sum -c -
      - name: Build installer
        working-directory: windows
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: windows/out/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [version, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ls -la dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "${{ github.sha }}" --title "MAD Equalizer ${TAG#v}" --generate-notes
          fi
