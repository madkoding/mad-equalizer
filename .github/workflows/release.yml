name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (por ejemplo v2.0.0); se crea desde main si no existe"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  macos:
    name: Build macOS (.dmg)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build universal app
        working-directory: macos
        run: ./build.sh
      - name: Make DMG
        working-directory: macos
        run: ./make_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: macos/*.dmg
          if-no-files-found: error

  windows:
    name: Build Windows (setup .zip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh nsis
      - name: Install dependencies
        working-directory: windows
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci
      - name: Download Electron runtime (verified)
        working-directory: windows
        run: |
          V=$(sed -n 's/^V=//p' pack.sh)
          mkdir -p .cache
          base=https://github.com/electron/electron/releases/download/v$V
          curl -sSLf -o .cache/electron-v$V-win32-x64.zip $base/electron-v$V-win32-x64.zip
          curl -sSLf -o SHASUMS256.txt $base/SHASUMS256.txt
          grep " \*electron-v$V-win32-x64.zip$" SHASUMS256.txt | sed 's#\*#.cache/#' | sha256sum -c -
      - name: Download Equalizer APO installer (verified)
        working-directory: windows
        run: |
          mkdir -p vendor
          curl -sSLf -o vendor/EqualizerAPO-x64-1.4.2.exe \
            "https://sourceforge.net/projects/equalizerapo/files/1.4.2/EqualizerAPO-x64-1.4.2.exe/download"
          echo "7403be7427bbe1936a40dded082829b6e217fc4f5990fee5cba501f0ae055afa  vendor/EqualizerAPO-x64-1.4.2.exe" | sha256sum -c -
      - name: Build installer
        working-directory: windows
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: windows/out/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "${{ github.sha }}" --title "MAD Equalizer ${TAG#v}" --generate-notes
          fi
