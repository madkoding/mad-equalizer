name: Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", "windows/renderer/**", "windows/main.js", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: actions/configure-pages@v6
      - name: Install Electron and Xvfb
        working-directory: windows
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          npm ci
      - name: Capture fresh screenshot (demo mode)
        working-directory: windows
        run: |
          xvfb-run -a -s "-screen 0 2400x1800x24" npx electron . --no-sandbox --screenshot="$GITHUB_WORKSPACE/docs/img/screenshot.png"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
